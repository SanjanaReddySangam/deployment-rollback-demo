name: Deploy and Rollback

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Deploy version 2
        run: |
          echo "Deploying version 2..."
          docker compose build --build-arg APP_VERSION=v2
          docker compose up -d

      - name: Health Check
        run: |
          echo "Running health check..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000)
          echo "HTTP STATUS: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Deployment failed. Rolling back to v1..."
            docker compose build --build-arg APP_VERSION=v1
            docker compose up -d
          else
            echo "Deployment successful."
          fi
